name: Build and deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 9 * * 1'   # every Monday: refresh the demo booking slots
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # --- Python: tests, then generate data files ---
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test Python scripts
        run: python -m unittest discover -s python/tests
      - name: Generate booking slots and insights index
        run: |
          python python/generate_slots.py
          python python/build_insights_index.py

      # --- Node: build the Astro site ---
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build
        env:
          SITE: https://${{ github.repository_owner }}.github.io
          BASE: /${{ github.event.repository.name }}
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
